<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="80%" stop-color="#050810" />
      <stop offset="100%" stop-color="#020408" />
    </radialGradient>
    <linearGradient id="goldGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FACC15" />
      <stop offset="50%" stop-color="#4ADE80" />
      <stop offset="100%" stop-color="#22C55E" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Disc Background with Gold-Green Border -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGlow)" stroke="url(#goldGreen)" stroke-width="2" />

  <!-- Geodesic Mesh Sphere Network -->
  <g stroke="url(#goldGreen)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.95" filter="url(#glow)">
    <!-- Outer Ring Structure -->
    <polygon points="32,8 52,19.5 52,44.5 32,56 12,44.5 12,19.5" fill="none" />

    <!-- Inner Interconnected Facets -->
    <polygon points="32,18 44,25 44,39 32,46 20,39 20,25" fill="rgba(34,197,94,0.15)" />
    <line x1="32" y1="8" x2="32" y2="18" />
    <line x1="52" y1="19.5" x2="44" y2="25" />
    <line x1="52" y1="44.5" x2="44" y2="39" />
    <line x1="32" y1="56" x2="32" y2="46" />
    <line x1="12" y1="44.5" x2="20" y2="39" />
    <line x1="12" y1="19.5" x2="20" y2="25" />

    <!-- Quantum Triangulation Lattice -->
    <line x1="32" y1="18" x2="44" y2="39" />
    <line x1="44" y1="25" x2="32" y2="46" />
    <line x1="44" y1="39" x2="20" y2="39" />
    <line x1="32" y1="46" x2="20" y2="25" />
    <line x1="20" y1="39" x2="32" y2="18" />
    <line x1="20" y1="25" x2="44" y2="25" />
  </g>

  <!-- Glowing Central AI Core -->
  <circle cx="32" cy="32" r="5" fill="#FACC15" filter="url(#glow)" />
  <circle cx="32" cy="32" r="2.5" fill="#FFFFFF" />

  <!-- Quantum Lattice Nodes -->
  <circle cx="32" cy="8" r="2.2" fill="#FACC15" />
  <circle cx="52" cy="19.5" r="2.2" fill="#22C55E" />
  <circle cx="52" cy="44.5" r="2.2" fill="#FACC15" />
  <circle cx="32" cy="56" r="2.2" fill="#22C55E" />
  <circle cx="12" cy="44.5" r="2.2" fill="#FACC15" />
  <circle cx="12" cy="19.5" r="2.2" fill="#22C55E" />
</svg>